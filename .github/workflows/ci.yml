name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # update the coverage badge on the badges branch (main only)
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,service]"
      - name: Lint
        run: ruff check .
      - name: Typecheck
        if: matrix.python-version == '3.12'
        run: mypy txn_agent
      - name: Test
        run: pytest -q --cov=txn_agent --cov-report=xml --cov-report=term --cov-fail-under=85
      - name: Update coverage badge (badges branch)
        if: matrix.python-version == '3.12' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PCT=$(python -c "import xml.etree.ElementTree as ET; print(round(float(ET.parse('coverage.xml').getroot().attrib['line-rate'])*100))")
          COLOR=brightgreen; [ "$PCT" -lt 85 ] && COLOR=orange
          CONTENT=$(printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}' "$PCT" "$COLOR" | base64 -w0)
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/coverage.json?ref=badges" --jq .sha 2>/dev/null || true)
          ARGS=(-f message "badge: coverage ${PCT}%" -f content "$CONTENT" -f branch badges)
          [ -n "$SHA" ] && ARGS+=(-f sha "$SHA")
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/coverage.json" "${ARGS[@]}" --jq .commit.sha
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        continue-on-error: true  # coverage upload outages must never fail CI
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}  # optional for public repos, more reliable when set
          fail_ci_if_error: false

  service-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[service]"
      - name: Start service
        run: |
          uvicorn txn_agent.service:app --port 8080 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/healthz && break
            sleep 1
          done
      - name: End-to-end smoke (search -> cart -> checkout -> purchased -> ops)
        run: python scripts/service_smoke.py
      - name: Server log on failure
        if: failure()
        run: cat /tmp/uvicorn.log
