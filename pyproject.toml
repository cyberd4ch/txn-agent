[project]
name = "txn-agent"
version = "0.4.3"
description = "Safety-first transaction layer for purchasing agents: deterministic policy gate, human approvals, idempotent checkout"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["agents", "llm", "commerce", "procurement", "payments", "safety", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Core is stdlib-only; examples/tests/docs are intentionally not packaged.
packages = ["txn_agent", "txn_agent.connectors"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "httpx"]
llm = ["anthropic"]
service = ["fastapi>=0.110", "uvicorn"]

[project.urls]
Homepage = "https://github.com/cyberd4ch/txn-agent"
Documentation = "https://github.com/cyberd4ch/txn-agent/tree/main/docs"
Changelog = "https://github.com/cyberd4ch/txn-agent/blob/main/CHANGELOG.md"

[project.scripts]
txn-agent = "txn_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# UP007: keep X | None strings as-is for 3.10; B008 etc not needed yet
ignore = ["UP007"]

[tool.ruff.lint.per-file-ignores]
# B008: Depends() in argument defaults is the canonical FastAPI idiom
"txn_agent/service.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["txn_agent"]

[[tool.mypy.overrides]]
module = ["fastapi.*", "pydantic.*"]
# typed upstream; keep strict local analysis
follow_imports = "normal"
